<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060a18" />
    <title>TaskOrb · Offline</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(80% 60% at 50% 30%, #13204a, #060a18);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 6px 0 0;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 320px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        background: #4d84ff;
        color: #fff;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>TaskOrb needs a connection to load your boards. It will reload as soon as you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
